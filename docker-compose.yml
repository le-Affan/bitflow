name: bitflow

# `docker compose up -d` starts: postgres -> db-init (seeds an empty database once) -> migrate -> backend, scheduler,
# frontend. Every setting has a default here (local use); a .env file is optional and only overrides them
# (see .env.example, which lists the same defaults).

x-backend-build: &backend-build
  context: ./backend
  dockerfile: ../docker/backend.Dockerfile
  target: base

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bitflow}:${POSTGRES_PASSWORD:-bitflow}@postgres:5432/${POSTGRES_DB:-bitflow}
  BLOCKCHAIN_INFO_BASE_URL: ${BLOCKCHAIN_INFO_BASE_URL:-}
  INGEST_REQUEST_PAUSE_SECONDS: ${INGEST_REQUEST_PAUSE_SECONDS:-}
  INGEST_MAX_RETRIES: ${INGEST_MAX_RETRIES:-}
  INGEST_BACKOFF_BASE_SECONDS: ${INGEST_BACKOFF_BASE_SECONDS:-}
  INGEST_CONNECT_TIMEOUT_SECONDS: ${INGEST_CONNECT_TIMEOUT_SECONDS:-}
  INGEST_READ_TIMEOUT_SECONDS: ${INGEST_READ_TIMEOUT_SECONDS:-}
  INGEST_MARGIN_BLOCKS: ${INGEST_MARGIN_BLOCKS:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitflow}
      POSTGRES_DB: ${POSTGRES_DB:-bitflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published on the host: use `docker compose exec postgres psql -U <user> -d <db>`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: if the database has no tables yet, restore ./seed/bitflow.dump (if present). Never runs a second seed.
  db-init:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitflow}
      POSTGRES_DB: ${POSTGRES_DB:-bitflow}
    volumes:
      - ./seed:/seed:ro,z
      - ./docker/db-init.sh:/db-init.sh:ro,z
    command: ["/db-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: brings the schema up to date (no-op when the seed already has the latest schema).
  migrate:
    build: *backend-build
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  backend:
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-env
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://127.0.0.1:${FRONTEND_HOST_PORT:-3000},http://localhost:${FRONTEND_HOST_PORT:-3000},http://127.0.0.1:${FRONTEND_E2E_HOST_PORT:-3100}}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Ingests every missing complete UTC day: once at start, then daily at DAILY_INGEST_TIME_UTC. Runs on its own;
  # the backend keeps serving the stored days meanwhile.
  scheduler:
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-env
      DAILY_INGEST_TIME_UTC: ${DAILY_INGEST_TIME_UTC:-00:30}
    command: ["python", "-m", "app.ingestion.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs the test suite against the real postgres service. Not started by `docker compose up`.
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bitflow}:${POSTGRES_PASSWORD:-bitflow}@postgres:5432/${POSTGRES_TEST_DB:-bitflow_test}
    volumes:
      - ./backend:/app:z
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: serve
      args:
        # Baked into the static build: the URL the browser uses to reach the backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:${BACKEND_HOST_PORT:-8000}}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend

  # Frontend unit tests (Vitest). Not started by `docker compose up`.
  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: test

  # Same static build as `frontend`, plus the e2e inspector (VITE_E2E_INSPECTOR=true). Only for Playwright.
  frontend-e2e-app:
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: serve
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:${BACKEND_HOST_PORT:-8000}}
        VITE_E2E_INSPECTOR: "true"
    ports:
      - "127.0.0.1:${FRONTEND_E2E_HOST_PORT:-3100}:80"
    depends_on:
      - backend

  # Playwright tests against frontend-e2e-app and the real backend (host network, so 127.0.0.1 is the host).
  frontend-e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    network_mode: host
    depends_on:
      - frontend-e2e-app
    working_dir: /work
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://127.0.0.1:${FRONTEND_E2E_HOST_PORT:-3100}
      # "1" = mock every API call as "no day ingested" (checks the suite does not depend on stored data).
      E2E_MOCK_EMPTY_API: ${E2E_MOCK_EMPTY_API:-}
      E2E_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:${BACKEND_HOST_PORT:-8000}}
    volumes:
      - ./frontend:/work:z
    command: ["npx", "playwright", "test"]

volumes:
  postgres-data:

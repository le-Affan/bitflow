name: bitflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BLOCKCHAIN_INFO_BASE_URL: ${BLOCKCHAIN_INFO_BASE_URL:-}
      INGEST_REQUEST_PAUSE_SECONDS: ${INGEST_REQUEST_PAUSE_SECONDS:-}
      INGEST_MAX_RETRIES: ${INGEST_MAX_RETRIES:-}
      INGEST_BACKOFF_BASE_SECONDS: ${INGEST_BACKOFF_BASE_SECONDS:-}
      INGEST_CONNECT_TIMEOUT_SECONDS: ${INGEST_CONNECT_TIMEOUT_SECONDS:-}
      INGEST_READ_TIMEOUT_SECONDS: ${INGEST_READ_TIMEOUT_SECONDS:-}
      INGEST_MARGIN_BLOCKS: ${INGEST_MARGIN_BLOCKS:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Runs the test suite against the real postgres service. Not started by `docker compose up`.
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_TEST_DB:-bitflow_test}
    volumes:
      - ./backend:/app:z
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: serve
      args:
        # Baked into the static build: the URL the browser uses to reach the backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend

  # Frontend unit tests (Vitest). Not started by `docker compose up`.
  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: test

  # Playwright smoke tests against the running stack (host network, so 127.0.0.1 is the host).
  frontend-e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    network_mode: host
    working_dir: /work
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://127.0.0.1:${FRONTEND_HOST_PORT:-3000}
      E2E_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    volumes:
      - ./frontend:/work:z
    command: ["npx", "playwright", "test"]

volumes:
  postgres-data:
